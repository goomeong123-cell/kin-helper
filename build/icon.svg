  <path d="M136 132h240a40 40 0 0 1 40 40v136a40 40 0 0 1-40 40H254l-70 58c-8 6-18 1-18-9v-49h-30a40 40 0 0 1-40-40V172a40 40 0 0 1 40-40z" fill="#fff"/>
